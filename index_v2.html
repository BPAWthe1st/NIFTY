<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Map Route & Supercharger Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen antialiased">

    <div class="flex flex-col h-screen">
        <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shrink-0">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                ⚡ Real Map Route & Supercharger Planner
            </h1>
            <div id="stop-counter" class="text-sm bg-gray-900 px-3 py-1 rounded border border-gray-700 text-gray-400">
                Stops: 0 / 200
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <div class="w-5/12 bg-gray-800/40 border-r border-gray-800 flex flex-col h-full p-6">
                <form id="add-form" class="mb-4 shrink-0">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Add Destination from Database</label>
                    <div class="flex gap-2">
                        <select id="location-select" class="flex-1 bg-gray-950 border border-gray-700 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500 text-sm">
                            </select>
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2 rounded text-sm transition shrink-0">
                            + Add Stop
                        </button>
                    </div>
                </form>

                <div id="timeline-container" class="flex-1 overflow-y-auto pr-2 space-y-4">
                    </div>
            </div>

            <div class="w-7/12 p-6 flex flex-col h-full space-y-4">
                <div class="grid grid-cols-3 gap-4 shrink-0">
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Route Distance</div>
                        <div class="text-2xl font-black text-emerald-400 mt-1"><span id="stat-distance">0</span> <span class="text-sm font-normal text-gray-400">mi</span></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Travel Hours</div>
                        <div class="text-2xl font-black text-blue-400 mt-1"><span id="stat-time">0</span> <span class="text-sm font-normal text-gray-400">hrs</span></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Projected Horizon</div>
                        <div class="text-2xl font-black text-amber-400 mt-1"><span id="stat-days">0</span> <span class="text-sm font-normal text-gray-400">days</span></div>
                    </div>
                </div>

                <div class="flex-1 bg-gray-950 rounded-xl border border-gray-800 relative overflow-hidden shadow-inner">
                    <div id="map" class="w-full h-full z-0"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const geoDatabase = {
            "San Francisco, CA": { lat: 37.7749, lng: -122.4194 },
            "Zion National Park, UT": { lat: 37.2982, lng: -113.0263 },
            "Denver, CO": { lat: 39.7392, lng: -104.9903 },
            "Concord, NH": { lat: 43.2081, lng: -71.5375 },
            "Acadia National Park, ME": { lat: 44.3386, lng: -68.2733 },
            "New York City, NY": { lat: 40.7128, lng: -74.0060 },
            "Baltimore, MD": { lat: 39.2904, lng: -76.6122 },
            "Norfolk, VA": { lat: 36.8508, lng: -76.2859 },
            "Cleveland, OH": { lat: 41.4993, lng: -81.6944 },
            "Detroit, MI": { lat: 42.3314, lng: -83.0458 },
            "Toronto, ON": { lat: 43.6532, lng: -79.3832 },
            "Philadelphia, PA": { lat: 39.9526, lng: -75.1652 },
            "Houston, TX": { lat: 29.7604, lng: -95.3698 },
            "Theodore Roosevelt NP, ND": { lat: 46.9509, lng: -103.4627 },
            "Banff National Park, AB": { lat: 51.4968, lng: -115.9281 },
            "Bigfork, MT": { lat: 48.0633, lng: -114.0726 },
            "Crater Lake NP, OR": { lat: 42.9420, lng: -122.1051 }
        };

        // Added showChargers boolean to state
        let stops = [
            { id: "1", key: "San Francisco, CA", mode: "drive", days: 1, showChargers: true },
            { id: "2", key: "Zion National Park, UT", mode: "drive", days: 3, showChargers: true },
            { id: "3", key: "Denver, CO", mode: "drive", days: 4, showChargers: true }
        ];

        let map;
        let mapLayers = [];

        function initMap() {
            map = L.map('map', { center: [39.8283, -98.5795], zoom: 4 });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);
        }

        function initDropdown() {
            const select = document.getElementById('location-select');
            Object.keys(geoDatabase).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = key;
                select.appendChild(opt);
            });
        }

        function calculateHaversineDistance(coords1, coords2) {
            const R = 3958.8; 
            const dLat = (coords2.lat - coords1.lat) * Math.PI / 180;
            const dLng = (coords2.lng - coords1.lng) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(coords1.lat * Math.PI / 180) * Math.cos(coords2.lat * Math.PI / 180) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function changeMode(id, value) { stops.find(s => s.id === id).mode = value; renderApp(); }
        function changeDays(id, value) { stops.find(s => s.id === id).days = parseInt(value) || 0; renderApp(); }
        function toggleChargers(id, checked) { stops.find(s => s.id === id).showChargers = checked; renderApp(); }
        function removeStop(index) { stops.splice(index, 1); renderApp(); }

        function moveStop(index, direction) {
            if (direction === -1 && index === 0) return;
            if (direction === 1 && index === stops.length - 1) return;
            const temp = stops[index];
            stops[index] = stops[index + direction];
            stops[index + direction] = temp;
            renderApp();
        }

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const select = document.getElementById('location-select');
            if (stops.length >= 200) return;
            stops.push({ id: String(Date.now()), key: select.value, mode: "drive", days: 2, showChargers: true });
            renderApp();
        });

        function clearMapLayers() {
            mapLayers.forEach(layer => map.removeLayer(layer));
            mapLayers = [];
        }

        function renderApp() {
            document.getElementById('stop-counter').innerText = `Stops: ${stops.length} / 200`;
            clearMapLayers();

            let htmlContent = '';
            let totalDistance = 0, totalTransitTime = 0, totalDays = 0;
            let mapLatLngBounds = [];

            stops.forEach((stop, index) => {
                totalDays += stop.days;
                const currentGeo = geoDatabase[stop.key];

                if (index > 0) {
                    const prevStop = stops[index - 1];
                    const prevGeo = geoDatabase[prevStop.key];
                    
                    const directDistance = calculateHaversineDistance(prevGeo, currentGeo);
                    const isDrive = stop.mode === 'drive';
                    const legMiles = Math.round(isDrive ? directDistance * 1.25 : directDistance);
                    const legHours = isDrive ? Math.round((legMiles / 62) * 10) / 10 : Math.round(((legMiles / 500) + 1.5) * 10) / 10;

                    totalDistance += legMiles;
                    totalTransitTime += legHours;

                    htmlContent += `
                        <div class="flex items-center pl-8 my-1 border-l-2 border-dashed border-gray-700 py-1.5">
                            <div class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs flex items-center gap-3 w-full shadow-inner">
                                <span class="text-base">${isDrive ? '🚗' : '✈️'}</span>
                                <div>
                                    <span class="text-gray-400 font-semibold">Leg ${index} ➔ ${index + 1}:</span> 
                                    <strong class="${isDrive ? 'text-emerald-400' : 'text-blue-400'}">${legMiles} mi</strong> 
                                    <span class="text-gray-600">|</span> 
                                    <span class="text-gray-300">~${legHours} hrs transit</span>
                                </div>
                            </div>
                        </div>
                    `;

                    // Draw Route Path
                    const polyline = L.polyline([[prevGeo.lat, prevGeo.lng], [currentGeo.lat, currentGeo.lng]], {
                        color: isDrive ? '#34d399' : '#38bdf8', weight: 4, dashArray: isDrive ? null : '6, 8', opacity: 0.85
                    }).addTo(map);
                    mapLayers.push(polyline);

                    // Plot Superchargers along the path if driving and toggled ON
                    if (isDrive && stop.showChargers) {
                        const chargerIntervalMiles = 150; 
                        const numChargers = Math.floor(legMiles / chargerIntervalMiles);
                        
                        for (let i = 1; i <= numChargers; i++) {
                            const fraction = i / (numChargers + 1);
                            // Simple linear interpolation for mock charger coordinates
                            const mockLat = prevGeo.lat + (currentGeo.lat - prevGeo.lat) * fraction;
                            const mockLng = prevGeo.lng + (currentGeo.lng - prevGeo.lng) * fraction;
                            
                            const chargerMarker = L.circleMarker([mockLat, mockLng], {
                                radius: 4, fillColor: '#ef4444', color: '#7f1d1d', weight: 1, fillOpacity: 1
                            }).addTo(map).bindPopup('<b>⚡ Simulated Supercharger</b><br>Approx. 150mi interval');
                            
                            mapLayers.push(chargerMarker);
                        }
                    }
                }

                if (currentGeo) {
                    const marker = L.circleMarker([currentGeo.lat, currentGeo.lng], {
                        radius: index === 0 ? 9 : 7, fillColor: index === 0 ? '#fbbf24' : '#10b981', color: '#111827', weight: 2, fillOpacity: 0.9
                    }).addTo(map).bindPopup(`<b>${index + 1}. ${stop.key}</b>`);
                    mapLayers.push(marker);
                    mapLatLngBounds.push([currentGeo.lat, currentGeo.lng]);
                }

                htmlContent += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow relative">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold text-gray-300">${index + 1}</span>
                                <h3 class="font-bold text-white text-sm">${stop.key}</h3>
                            </div>
                            <div class="flex gap-1 bg-gray-900/50 p-1 rounded border border-gray-800 shrink-0">
                                <button onclick="moveStop(${index}, -1)" class="text-gray-400 hover:text-white px-1 disabled:opacity-20 text-xs" ${index === 0 ? 'disabled' : ''}>▲</button>
                                <button onclick="moveStop(${index}, 1)" class="text-gray-400 hover:text-white px-1 disabled:opacity-20 text-xs" ${index === stops.length - 1 ? 'disabled' : ''}>▼</button>
                                <button onclick="removeStop(${index})" class="text-red-400 hover:text-red-300 px-1.5 text-xs font-bold ml-1 border-l border-gray-700">✕</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mt-2.5 pt-2.5 border-t border-gray-700/50">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Transit Choice</label>
                                <select onchange="changeMode('${stop.id}', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white focus:outline-none" ${index === 0 ? 'disabled' : ''}>
                                    <option value="drive" ${stop.mode === 'drive' ? 'selected' : ''}>🚗 Drive Leg</option>
                                    <option value="flight" ${stop.mode === 'flight' ? 'selected' : ''}>✈️ Flight Leg</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Days Stayed</label>
                                <input type="number" min="0" value="${stop.days}" oninput="changeDays('${stop.id}', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white focus:outline-none">
                            </div>
                        </div>
                        
                        ${index > 0 && stop.mode === 'drive' ? `
                        <div class="mt-3 flex items-center gap-2">
                            <input type="checkbox" id="tesla-${stop.id}" ${stop.showChargers ? 'checked' : ''} onchange="toggleChargers('${stop.id}', this.checked)" class="rounded bg-gray-900 border-gray-700 text-emerald-500 cursor-pointer">
                            <label for="tesla-${stop.id}" class="text-[11px] font-medium text-gray-400 cursor-pointer hover:text-gray-200">Show Mock Superchargers</label>
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            document.getElementById('timeline-container').innerHTML = htmlContent;
            document.getElementById('stat-distance').innerText = totalDistance.toLocaleString();
            document.getElementById('stat-time').innerText = Math.round(totalTransitTime);
            document.getElementById('stat-days').innerText = totalDays + Math.ceil(totalTransitTime / 8);

            if (mapLatLngBounds.length > 0 && map) map.fitBounds(mapLatLngBounds, { padding: [40, 40] });
        }

        window.onload = () => { initMap(); initDropdown(); renderApp(); };
    </script>
</body>
</html>
