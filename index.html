<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    </head>
<body class="bg-gray-50 text-gray-900 min-h-screen antialiased flex flex-col h-screen relative">

    <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold text-emerald-600">🚙 NIFTY:</span>
            <!-- Editable Trip Name -->
            <input type="text" id="trip-name-input" value="My Trip" onchange="window.renameCurrentTrip(this.value)" class="text-lg font-bold text-gray-700 bg-transparent hover:bg-gray-50 focus:bg-white border border-transparent focus:border-emerald-300 rounded px-2 py-0.5 outline-none transition w-64 truncate">
        </div>
        
        <div class="flex items-center gap-3 relative">
            <div id="stop-counter" class="text-sm bg-gray-100 px-3 py-1 rounded border border-gray-300 text-gray-600 font-medium">Stops: 0</div>
            
            <!-- NEW TRIPS MENU -->
            <div class="relative">
                <button onclick="window.toggleTripMenu()" class="bg-white hover:bg-gray-50 text-gray-700 font-semibold text-sm px-4 py-1.5 rounded border border-gray-300 transition flex items-center gap-1 shadow-sm">
                    📂 Trips <span class="text-[10px]">▼</span>
                </button>
                <div id="trip-dropdown-menu" class="hidden absolute right-0 mt-1 w-64 bg-white border border-gray-200 shadow-xl rounded-lg z-[2000] overflow-hidden">
                    <div class="px-3 py-2 bg-gray-50 border-b border-gray-100 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Your Saved Trips</div>
                    <div id="trip-list-container" class="max-h-64 overflow-y-auto"></div>
                    <div class="p-2 border-t border-gray-100">
                        <button onclick="window.createNewTrip()" class="w-full text-left px-3 py-2 text-sm text-emerald-700 hover:bg-emerald-50 font-bold rounded transition">+ Create New Trip</button>
                    </div>
                </div>
            </div>
            
            <button onclick="toggleKeyDatesModal(true)" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm px-4 py-1.5 rounded border border-amber-500 transition shadow-sm">📅 Key Dates</button>
            <button onclick="toggleModal(true)" class="bg-white hover:bg-gray-50 text-gray-700 font-semibold text-sm px-4 py-1.5 rounded border border-gray-300 transition shadow-sm">⚙️ Settings</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <div class="w-1/2 bg-white border-r border-gray-200 flex flex-col h-full p-6 z-0">

            <div id="status-console" class="hidden mb-4 p-2 bg-gray-100 rounded text-[10px] text-emerald-700 font-mono h-24 overflow-y-auto border border-gray-300 shadow-inner"></div>

            <div id="timeline-container" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-0 p-1">
                </div>
        </div>

        <div class="w-1/2 p-6 flex flex-col h-full space-y-4 bg-gray-50">
            
            <div class="grid grid-cols-4 gap-3 mb-2">
                <div class="bg-white rounded-xl border border-gray-200 p-2 shadow-sm flex flex-col items-center text-center">
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Distance</span>
                    <div id="stat-distance" class="w-full flex flex-col items-center"></div>
                </div>
                
                <div class="bg-white rounded-xl border border-gray-200 p-2 shadow-sm flex flex-col items-center text-center">
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Transit</span>
                    <div id="stat-transit-days" class="w-full flex flex-col items-center"></div>
                </div>
                
                <div class="bg-white rounded-xl border border-gray-200 p-2 shadow-sm flex flex-col items-center text-center">
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Stay</span>
                    <div id="stat-stay-days" class="w-full flex flex-col items-center"></div>
                </div>
                
                <div class="bg-white rounded-xl border border-gray-200 p-2 shadow-sm flex flex-col items-center text-center">
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Total</span>
                    <div id="stat-total-days" class="w-full flex flex-col items-center"></div>
                </div>
            </div>

            <div class="flex-1 bg-gray-100 rounded-xl border border-gray-300 relative overflow-hidden shadow-inner">
                <div id="map" class="w-full h-full z-0"></div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="bg-white border border-gray-200 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-200">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-800">⚙️ Core Configuration</h2>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-700 font-bold w-6 h-6 rounded-full flex items-center justify-center border border-transparent hover:bg-gray-100 transition">✕</button>
            </div>
            
            <div class="space-y-4">
                <div class="pt-4 border-t border-gray-100 mt-4 space-y-4">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Include Real-time Traffic</span>
                        <input type="checkbox" id="traffic-toggle" 
                               onchange="updateSettings('includeTraffic', this.checked)" 
                               class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500">
                    </label>

                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Include Charging Delays (+10%)</span>
                        <input type="checkbox" id="charging-toggle" 
                               onchange="updateSettings('includeChargingDelays', this.checked)" 
                               class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500">
                    </label>

                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Show Inactive Stops in Timeline</span>
                        <input type="checkbox" id="show-inactive-stops-toggle" checked
                               onchange="updateSettings('showTimelineInactiveStops', this.checked)" 
                               class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500">
                    </label>
                </div>
            </div>

            <div class="pt-4 border-t border-gray-200 mt-4 flex justify-between items-center">
                <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Data Management</span>
                <div class="flex gap-2">
                    <button onclick="exportToFile()" class="bg-white hover:bg-gray-50 text-gray-700 text-xs px-3 py-1.5 rounded border border-gray-300 transition shadow-sm">
                        📥 Export
                    </button>
                    <button onclick="document.getElementById('import-upload').click()" class="bg-white hover:bg-gray-50 text-gray-700 text-xs px-3 py-1.5 rounded border border-gray-300 transition shadow-sm">
                        📤 Import
                    </button>
                    <input type="file" id="import-upload" accept=".json" class="hidden" onchange="importFromFile(event)">
                </div>
            </div>
            
            <div class="mt-6 pt-4 border-t border-gray-200 flex justify-end">
                <button onclick="toggleModal(false); calculateRoute();" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-2.5 rounded-lg transition shadow-sm">Close & Apply</button>
            </div>
        </div>
    </div>

    <div id="key-dates-modal" class="hidden fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="bg-white border border-gray-200 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-200">
                <h2 class="text-sm font-bold uppercase tracking-wider text-amber-600">📅 Fixed Key Dates</h2>
                <button onclick="toggleKeyDatesModal(false)" class="text-gray-400 hover:text-gray-700 font-bold w-6 h-6 rounded-full flex items-center justify-center border border-transparent hover:bg-gray-100 transition">✕</button>
            </div>
            
            <form id="key-date-form" class="space-y-4 mb-4 bg-gray-50 p-4 rounded-xl border border-gray-200" onsubmit="handleKeyDateSubmit(event)">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">Constraint / Location</label>
                    <div class="relative">
                        <input type="text" id="kd-location" autocomplete="off" required placeholder="e.g., Yosemite National Park" 
                               class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-gray-900 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition shadow-sm"
                               oninput="handleKeyDateSearch(this.value)">
                        <div id="kd-search-results" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl hidden z-[2000] max-h-48 overflow-y-auto"></div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">Start Date</label>
                        <input type="date" id="kd-start" required class="w-full bg-white border border-gray-300 rounded px-2 py-2 text-gray-900 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition cursor-pointer shadow-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">End Date</label>
                        <input type="date" id="kd-end" required class="w-full bg-white border border-gray-300 rounded px-2 py-2 text-gray-900 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition cursor-pointer shadow-sm">
                    </div>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-4 py-2.5 rounded-lg transition mt-2 shadow-sm">
                    + Add Key Date
                </button>
            </form>

            <div id="key-dates-list" class="space-y-2 mb-6 max-h-40 overflow-y-auto pr-1"></div>

            <div class="pt-4 border-t border-gray-200 flex justify-end">
                <button onclick="toggleKeyDatesModal(false)" class="bg-white hover:bg-gray-50 text-gray-800 font-bold text-xs px-5 py-2.5 rounded-lg border border-gray-300 shadow-sm transition">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
